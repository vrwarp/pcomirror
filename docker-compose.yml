services:
  pcomirror:
    build: .
    image: pcomirror:latest
    container_name: pcomirror
    restart: unless-stopped
    ports:
      - "8080:8080"                 # JSON:API + webhook receiver
    env_file:
      - .env                        # PCO_APP_ID, PCO_SECRET, PCOMIRROR_PUBLIC_URL, ...
    volumes:
      - pcomirror-data:/data        # the SQLite file persists here
    # First boot: set PCOMIRROR_BACKFILL_ON_START=1 in .env to auto-load, or run
    #   docker compose run --rm pcomirror backfill
    # Webhooks: declare them in .env via PCOMIRROR_SUBSCRIPTIONS (applied on every
    # start, no follow-up command), or register one ad hoc:
    #   docker compose run --rm pcomirror add-subscription \
    #     --subscription-id <id> --event people.v2.events.person.updated \
    #     --secret <authenticity_secret> --url-token person-updated-01

volumes:
  pcomirror-data:
