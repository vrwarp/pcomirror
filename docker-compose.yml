services:
  pcomirror:
    build: .
    image: pcomirror:latest
    container_name: pcomirror
    restart: unless-stopped
    # The app is otherwise PID 1, and the kernel ignores a signal that PID 1 has
    # no handler for. `serve` installs one for SIGTERM, but one-shot commands and
    # a backfill-on-start (which runs before `serve` installs it) do not, so
    # `docker stop` would wait out the grace period and SIGKILL. A tiny init
    # forwards the signal and reaps children.
    init: true
    ports:
      - "8080:8080"                 # JSON:API + webhook receiver
    env_file:
      - .env                        # PCO_APP_ID, PCO_SECRET, PCOMIRROR_PUBLIC_URL, ...
    volumes:
      - pcomirror-data:/data        # the SQLite file persists here
    # Bind-mounting a host directory instead? Set PUID/PGID in .env to the uid:gid
    # that owns it, e.g.
    #   - /volume1/docker/pcomirror:/data
    # First boot: set PCOMIRROR_BACKFILL_ON_START=1 in .env to auto-load, or run
    #   docker compose run --rm pcomirror backfill
    # Webhooks: declare them in .env via PCOMIRROR_SUBSCRIPTIONS (applied on every
    # start, no follow-up command), manage them at /admin/webhooks (which takes
    # over from .env once used), or register some ad hoc — one receiver URL may
    # carry as many event types as you point at it:
    #   docker compose run --rm pcomirror add-subscription \
    #     --subscription-id <id> --event people.v2.events.person.updated \
    #     --event people.v2.events.person.created \
    #     --secret <authenticity_secret> --url-token person-events-01

volumes:
  pcomirror-data:
