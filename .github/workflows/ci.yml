name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are pointless; never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the README states; 3.13 is what the image ships.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Versions
        run: |
          python --version
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Syntax check
        run: python -m compileall -q pcomirror tests docs run_tests.py

      # No pip dependencies: the suite is pure standard library. run_tests.py runs
      # the unittest discovery *and* the SQL writer-semantics harness.
      - name: Run test suite
        run: python run_tests.py

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pcomirror:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: CLI smoke test (one-shot command)
        run: |
          docker run --rm pcomirror:ci init-db

      - name: Server smoke test (/healthz + /readyz)
        run: |
          docker run -d --name pcomirror-smoke -p 8080:8080 \
            pcomirror:ci serve --no-scheduler
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "healthz ok after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::server did not become healthy"
              docker logs pcomirror-smoke
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          echo
          docker logs pcomirror-smoke

      - name: Tear down
        if: always()
        run: docker rm -f pcomirror-smoke || true

  publish:
    name: push to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, docker]
    # Only publish from the canonical branch and release tags — never from PRs
    # (a PR from a fork must not get at the registry credentials).
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'vrwarp/pcomirror' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      # Resolves the image name here (rather than in workflow-level `env`, where
      # the secrets context is not available). Set the DOCKERHUB_IMAGE repository
      # variable to publish under a name other than <docker hub user>/pcomirror.
      - name: Resolve image name and check credentials
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets are not set."
            echo "Create a Docker Hub access token (Account Settings -> Personal access tokens)"
            echo "and add both as repository secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          name="${DOCKERHUB_IMAGE:-$DOCKERHUB_USERNAME/pcomirror}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "publishing as $name"

      # arm64 is emulated; the image is pure Python so there is nothing to compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=pcomirror
            org.opencontainers.image.description=Single-org Planning Center People mirror (SQLite, stdlib only)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed to Docker Hub"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
